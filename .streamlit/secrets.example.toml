# Copiar como secrets.toml. NO usar credenciales de producción.
[sql]
environment = "QA"
server = "SERVIDOR_QA\\INSTANCIA"
expected_server_name = "SERVIDOR_QA\\INSTANCIA" # Debe coincidir con @@SERVERNAME.
driver = "ODBC Driver 18 for SQL Server"
trusted_connection = true
username = ""
password = ""
encrypt = true
trust_server_certificate = false
# Ruta absoluta EN EL SERVIDOR SQL. La cuenta del servicio SQL debe poder escribir.
xel_directory = 'D:\SQLTraces\TrazaQA'
# Se usa para preflight y revisión; el filtro de captura es login/SPID para no perder saltos entre BDs.
databases = ["NOMBRE_BD_CPA", "BD_EXP", "BD_MAP"]
login_filter = "LOGIN_LEGACY_QA"
query_timeout = 20
