# ------------------------------------------------------------------------------
# AMBIENTE PRODUCCIÓN (172.16.71.41 / PRO-SQLWSPCLU)
# Reemplazo en Producción del Módulo de Oposiciones SNIA / IBM BPM
# ------------------------------------------------------------------------------
[sql_prod]
environment = "PROD"
server = "172.16.71.41"
expected_server_name = "PRO-SQLWSPCLU"
driver = "ODBC Driver 18 for SQL Server"
trusted_connection = false
username = "cpa_admin"
password = "TU_KEY_O_PASSWORD_PROD"
encrypt = true
trust_server_certificate = true
xel_directory = "DEFAULT"
databases = ["BD_EXP", "BD_PAR", "BD_MAP"]
login_filter = "cpa_admin"
query_timeout = 20

